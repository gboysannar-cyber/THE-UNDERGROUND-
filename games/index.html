<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Hub</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#080808;
    color:white;
    font-family:Arial,sans-serif;
}

body{
    overflow:hidden;
}

#menu{
    width:100%;
    height:100%;
    overflow:auto;
    padding:30px;
}

h1{
    margin:0 0 25px;
}

.games{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:16px;
}

.game{
    background:#151515;
    border:1px solid #333;
    border-radius:12px;
    padding:20px;
    cursor:pointer;
    transition:.15s;
}

.game:hover{
    background:#222;
    transform:translateY(-2px);
}

.game button{
    width:100%;
    padding:12px;
    border:0;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

#player{
    display:none;
    position:fixed;
    inset:0;
    background:#000;
    z-index:100;
}

#gameFrame{
    width:100%;
    height:100%;
    border:0;
    display:block;
    background:#000;
}

#toolbar{
    position:fixed;
    top:10px;
    left:10px;
    z-index:200;
    display:flex;
    gap:8px;
}

#toolbar button{
    background:#111;
    color:white;
    border:1px solid #444;
    border-radius:8px;
    padding:9px 13px;
    cursor:pointer;
}

#toolbar button:hover{
    background:#222;
}
</style>
</head>

<body>

<div id="menu">

<h1>🎮 Game Hub</h1>

<div class="games">

<div class="game" onclick="openGame('clidlebreakout.html')">
<h2>Idle Breakout</h2>
<button>PLAY</button>
</div>

<div class="game" onclick="openGame('clburgerandfrights.html')">
<h2>Burger & Frights</h2>
<button>PLAY</button>
</div>

<div class="game" onclick="openGame('ageofwar.html')">
<h2>Age of War</h2>
<button>PLAY</button>
</div>

<div class="game" onclick="openGame('timeshooter3.html')">
<h2>Time Shooter 3 SWAT</h2>
<button>PLAY</button>
</div>

<div class="game" onclick="openGame('ragdollarchers.html')">
<h2>Ragdoll Archers</h2>
<button>PLAY</button>
</div>

<div class="game" onclick="openGame('rooftopsnipers2.html')">
<h2>Rooftop Snipers 2</h2>
<button>PLAY</button>
</div>

<div class="game" onclick="openGame('basketballlegends.html')">
<h2>Basketball Legends</h2>
<button>PLAY</button>
</div>

<div class="game" onclick="openGame('granny.html')">
<h2>Granny</h2>
<button>PLAY</button>
</div>

<div class="game" onclick="openGame('geometrydash.html')">
<h2>Geometry Dash Lite</h2>
<button>PLAY</button>
</div>

</div>
</div>

<div id="player">

<div id="toolbar">
<button onclick="closeGame()">← Games</button>
<button onclick="fullscreenGame()">Fullscreen</button>
</div>

<iframe
id="gameFrame"
allow="autoplay; fullscreen; gamepad; pointer-lock"
allowfullscreen
scrolling="no">
</iframe>

</div>

<script>

const menu = document.getElementById("menu");
const player = document.getElementById("player");
const frame = document.getElementById("gameFrame");

function openGame(file){

    menu.style.display = "none";
    player.style.display = "block";

    frame.src = file;

    frame.onload = function(){
        try{
            frame.contentWindow.focus();
        }catch(e){}
    };
}

function closeGame(){

    frame.src = "about:blank";

    player.style.display = "none";
    menu.style.display = "block";
}

function fullscreenGame(){

    if(frame.requestFullscreen){
        frame.requestFullscreen().catch(()=>{});
    }
}

</script>

</body>
</html>
