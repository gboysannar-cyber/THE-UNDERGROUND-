<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Age of War</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

ruffle-player {
    display: block;
    width: 100vw;
    height: 100vh;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle"></script>
</head>

<body>

<script>
window.addEventListener("load", function () {

    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();

    player.style.width = "100vw";
    player.style.height = "100vh";

    document.body.appendChild(player);

    player.load(
        "https://cdn.jsdelivr.net/gh/artyomriseofnations/gs-swf@6ed8a67a935c49240d2a6dc1e8d4fc8466a28aca/Age%20of%20War.swf"
    );

});
</script>

</body>
</html>
