<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Game Hub</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

body {
    overflow-x: hidden;
}

header {
    padding: 25px;
    text-align: center;
    background: #111;
    border-bottom: 1px solid #333;
}

header h1 {
    margin: 0;
    font-size: 32px;
}

header p {
    color: #aaa;
    margin-bottom: 0;
}

#games {
    width: min(1100px, 94%);
    margin: 30px auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

.game {
    background: #151515;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 25px;
    text-align: center;
    cursor: pointer;
    transition: .15s;
}

.game:hover {
    transform: translateY(-3px);
    border-color: #777;
    background: #1d1d1d;
}

.game h2 {
    margin: 0 0 10px;
}

.game p {
    color: #aaa;
    margin: 0;
}

#player {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 1000;
}

#gameFrame {
    width: 100%;
    height: 100%;
    border: 0;
    background: #000;
}

#close {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 1001;
    border: 0;
    border-radius: 8px;
    padding: 10px 16px;
    background: #222;
    color: white;
    cursor: pointer;
    font-size: 16px;
}

#close:hover {
    background: #444;
}
</style>
</head>

<body>

<header>
    <h1>Game Hub</h1>
    <p>Choose a game</p>
</header>

<main id="games">

    <div class="game" onclick="openGame('games/ageofwar.html')">
        <h2>Age of War</h2>
        <p>Flash game</p>
    </div>

    <div class="game" onclick="openGame('games/timeshooter3.html')">
        <h2>Time Shooter 3 SWAT</h2>
        <p>Unity WebGL</p>
    </div>

    <div class="game" onclick="openGame('games/ragdollarchers.html')">
        <h2>Ragdoll Archers</h2>
        <p>Unity WebGL</p>
    </div>

    <div class="game" onclick="openGame('games/rooftopsnipers2.html')">
        <h2>Rooftop Snipers 2</h2>
        <p>Unity WebGL</p>
    </div>

    <div class="game" onclick="openGame('games/basketballlegends.html')">
        <h2>Basketball Legends</h2>
        <p>HTML5</p>
    </div>

    <div class="game" onclick="openGame('games/granny.html')">
        <h2>Granny</h2>
        <p>Unity WebGL</p>
    </div>

    <div class="game" onclick="openGame('games/geometrydash.html')">
        <h2>Geometry Dash Lite</h2>
        <p>Unity WebGL</p>
    </div>

    <div class="game" onclick="openGame('games/clidlebreakout.html')">
        <h2>Clidle Breakout</h2>
        <p>HTML5 Canvas</p>
    </div>

    <div class="game" onclick="openGame('games/burgerandfrights.html')">
        <h2>Burger & Frights</h2>
        <p>Three.js</p>
    </div>

</main>

<div id="player">
    <button id="close" onclick="closeGame()">✕ Close Game</button>
    <iframe id="gameFrame" allow="fullscreen; autoplay; gamepad; pointer-lock"></iframe>
</div>

<script>
function openGame(path) {
    const player = document.getElementById("player");
    const frame = document.getElementById("gameFrame");

    frame.src = path;
    player.style.display = "block";
}

function closeGame() {
    const frame = document.getElementById("gameFrame");

    frame.src = "about:blank";
    document.getElementById("player").style.display = "none";
}
</script>

</body>
</html>
